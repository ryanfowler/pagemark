[package]
name = "pagemark"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "Safe, deterministic extraction of useful content from HTML"
license = "MIT"
repository = "https://github.com/ryanfowler/pagemark"
keywords = ["html", "markdown", "readability", "extract"]
categories = ["text-processing", "web-programming"]

[features]
default = ["serde"]
serde = ["dep:serde", "url/serde"]

[dependencies]
html5ever = "0.27"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "extract"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
